<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Salescoach</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="overlay">
    <!-- The text below is English; overlay.ts fills it in the language of the settings (src/shared/i18n.ts). -->
    <div id="edge" class="edge stopped" aria-hidden="true"></div>
    <header class="bar">
      <button id="listen" type="button" class="listen primary">Start</button>
      <span id="status" class="status" role="status">Stopped</span>
      <div class="tools">
        <!-- Kind of call: hidden in a narrow window, the settings are the place then. -->
        <span class="calltype" data-i18n-title="overlay.callTypeTitle" title="Kind of call: picks the playbook for the next tip and for the feedback">
          <select id="callType" data-i18n-aria="overlay.callType" aria-label="Kind of call">
            <option value="sales" data-i18n="callTypeShort.sales">Sales</option>
            <option value="interview" data-i18n="callTypeShort.interview">Interview</option>
            <option value="meeting" data-i18n="callTypeShort.meeting">Meeting</option>
          </select>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6.5l3 3 3-3" /></svg>
        </span>
        <button id="tipBtn" type="button" class="quiet" data-i18n="overlay.tipNow">Tip now</button>
        <label class="switch" data-i18n-title="overlay.autoTitle" title="Get a tip by itself after an objection, question or buying signal">
          <input id="auto" type="checkbox" role="switch" />
          <span class="track" aria-hidden="true"></span>
          <span class="switch-text" data-i18n="overlay.auto">Auto</span>
        </label>
        <span class="divider" aria-hidden="true"></span>
        <button id="transcriptBtn" type="button" class="icon" title="Show transcript" aria-label="Show transcript">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6" /></svg>
        </button>
        <button id="settingsBtn" type="button" class="icon" data-i18n-title="overlay.settings" data-i18n-aria="overlay.settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5h5M10.5 5h3M2.5 11h2M7.5 11h6" /><circle cx="9" cy="5" r="1.5" /><circle cx="6" cy="11" r="1.5" /></svg>
        </button>
        <button id="hideBtn" type="button" class="icon" data-i18n-aria="overlay.hide" title="Hide (Ctrl+Shift+H)" aria-label="Hide">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" /></svg>
        </button>
      </div>
    </header>
    <main class="stage">
      <div id="tip" class="tip muted">Press Start when the call begins.</div>
      <div id="history" class="history" role="list" data-i18n-aria="overlay.history" aria-label="Earlier tips"></div>
      <div id="transcript" class="transcript hidden" data-i18n-aria="overlay.transcript" aria-label="Transcript"></div>
      <!-- After Stop, when the call lasted 2 minutes or more. -->
      <div id="afterCall" class="after-call" hidden>
        <button id="feedbackBtn" type="button" class="feedback-btn" data-i18n-title="overlay.feedbackTitle" title="Opens a window with feedback on the call you just had">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7.5H7.5l-3 2.5V11H2.5z" /><path d="M5.5 6.5h5M5.5 8.5h3" /></svg>
          <span data-i18n="overlay.feedback">Get feedback on this call</span>
        </button>
        <span id="callLength" class="after-meta"></span>
      </div>
    </main>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
